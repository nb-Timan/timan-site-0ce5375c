# Verifies the caller with auth.getUser and the canonical Backend role check.
[functions.admin-crm-delete]
verify_jwt = false

[functions.send-quote]
verify_jwt = false

# admin-user-actions verifies the JWT itself in code (it needs both the
# caller's Supabase Auth user AND the service-role key for admin operations).
[functions.admin-user-actions]
verify_jwt = false

# sharepoint-sync-dealers verifies the JWT itself in code (it needs both the
# caller's Supabase Auth user AND the service-role key for upserts).
[functions.sharepoint-sync-dealers]
verify_jwt = false

# geocode-dealers verifies the JWT itself in code; backend-only, server-side
# Nominatim geocoding of dealer_accounts addresses.
[functions.geocode-dealers]
verify_jwt = false

# geocode-warranty-customers verifies the JWT itself in code; backend/service
# only, server-side Nominatim geocoding of warranty_registrations customer
# addresses (writes only customer_latitude/longitude + status).
[functions.geocode-warranty-customers]
verify_jwt = false

# Prepared only. Do not deploy until OPENAI_API_KEY is configured in Supabase
# Secrets and News CMS has been wired to call the function.
[functions.translate-news-content]
verify_jwt = false

# Scheduler calls carry a Vault-held secret which is verified inside the
# function. Manual permanent deletion verifies the caller's real JWT in code.
[functions.marketing-video-retention]
verify_jwt = false

[functions.import-legacy-leads]
verify_jwt = false

[functions.import-site-changes-from-github]
verify_jwt = false

# Validates the caller JWT and canonical can_access_support() RPC internally,
# then uses the service role only for private Storage and background processing.
[functions.support-knowledge-ingestion]
verify_jwt = false

# Both functions validate the JWT and canonical can_access_support() RPC in
# their bodies before any service-role database or provider operation.
[functions.support-index-knowledge]
verify_jwt = false

# Manual calls verify can_access_support(); scheduled calls use a Vault-held secret.
[functions.support-knowledge-sync]
verify_jwt = false

[functions.support-chat]
verify_jwt = false

[functions.support-actions]
enabled = true
verify_jwt = true
import_map = "./functions/support-actions/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/support-actions/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/support-actions/*.html" ]

