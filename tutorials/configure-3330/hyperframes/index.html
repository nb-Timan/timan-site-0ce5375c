<!DOCTYPE html>
<html lang="da" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #101418;
        font-family: Inter, Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      #browser-recording {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .callout {
        position: absolute;
        left: 48px;
        bottom: 46px;
        display: flex;
        align-items: center;
        gap: 18px;
        max-width: 760px;
        padding: 18px 24px 18px 18px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        color: #ffffff;
        background: rgba(14, 20, 25, 0.92);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
        font-size: 30px;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .step-number {
        display: grid;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 50%;
        color: #ffffff;
        background: #168642;
        font-size: 25px;
        font-weight: 750;
      }

      .proof-label {
        position: absolute;
        top: 28px;
        right: 32px;
        padding: 10px 14px;
        border-radius: 6px;
        color: #ffffff;
        background: rgba(14, 20, 25, 0.78);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-ghew" id="root" data-composition-id="configure-3330-poc" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <video data-hf-id="hf-ew5t" id="browser-recording" class="clip" src="configure-3330-poc.webm" muted playsinline preload="auto" data-start="0" data-duration="11" data-track-index="0" data-has-audio="false"></video>

      <div data-hf-id="hf-ddpg" id="proof-label-track" class="clip" data-start="0" data-duration="11" data-track-index="1">
        <div data-hf-id="hf-lig6" class="proof-label">TIMAN Tutorial · proof of concept</div>
      </div>

      <div data-hf-id="hf-7v6k" id="step-1-track" class="clip" data-start="0.35" data-duration="2.15" data-track-index="2">
        <div data-hf-id="hf-mn7c" class="callout" id="callout-1">
          <span data-hf-id="hf-95ae" class="step-number">1</span>
          <span data-hf-id="hf-n51u">Vælg Timan 3330</span>
        </div>
      </div>

      <div data-hf-id="hf-chrx" id="step-2-track" class="clip" data-start="2.5" data-duration="2.1" data-track-index="2">
        <div data-hf-id="hf-xioz" class="callout" id="callout-2">
          <span data-hf-id="hf-9jlf" class="step-number">2</span>
          <span data-hf-id="hf-xr8s">Vælg levering</span>
        </div>
      </div>

      <div data-hf-id="hf-dj1t" id="step-3-track" class="clip" data-start="4.6" data-duration="4.1" data-track-index="2">
        <div data-hf-id="hf-rcz6" class="callout" id="callout-3">
          <span data-hf-id="hf-9xwg" class="step-number">3</span>
          <span data-hf-id="hf-7k7a">Tilpas maskinen</span>
        </div>
      </div>

      <div data-hf-id="hf-7rfl" id="step-4-track" class="clip" data-start="8.7" data-duration="2.3" data-track-index="2">
        <div data-hf-id="hf-asv9" class="callout" id="callout-4">
          <span data-hf-id="hf-75r9" class="step-number">4</span>
          <span data-hf-id="hf-py7a">Gennemgå konfigurationen</span>
        </div>
      </div>
    </main>

    <script>
      window.__timelines = window.__timelines || {};
      const timeline = gsap.timeline({ paused: true });

      [
        ["#callout-1", 0.35, 2.15],
        ["#callout-2", 2.5, 2.1],
        ["#callout-3", 4.6, 4.1],
        ["#callout-4", 8.7, 2.3],
      ].forEach(([selector, start, duration]) => {
        timeline.fromTo(
          selector,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" },
          start,
        );
        timeline.to(
          selector,
          { opacity: 0, y: 10, duration: 0.2, ease: "power1.in" },
          start + duration - 0.2,
        );
      });

      window.__timelines["configure-3330-poc"] = timeline;
    </script>
  </body>
</html>
